function getCitiesOptions() {
  const countries = {};
  
  // Grouper les villes par pays
  Object.keys(cities).forEach(city => {
    const country = countryMap[city] || 'Unknown';
    if (!countries[country]) {
      countries[country] = [];
    }
    countries[country].push(city);
  });
  
  // Trier les pays et les villes
  let options = '';
  Object.keys(countries).sort().forEach(country => {
    countries[country].sort().forEach(city => {
      options += `<option value="${city}">${city} - ${country}</option>`;
    });
  });
  
  return options;
}

function getDatesRange() {
  const dates = [];
  const start = new Date(2027, 2, 1); // March 1, 2027
  const end = new Date(2027, 4, 31); // May 31, 2027
  
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    dates.push(d.toISOString().split('T')[0]);
  }
  return dates;
}

function getHotDates() {
  const dates = getDatesRange();
  const hotDates = [];
  
  dates.forEach(date => {
    let count = 0;
    friends.forEach(f => {
      f.stays?.forEach(s => {
        if (s.checkin <= date && (!s.checkout || s.checkout >= date)) {
          count++;
        }
      });
    });
    
    if (count >= 3) {
      hotDates.push(date);
    }
  });
  
  return hotDates;
}

function getMeetingDates() {
  const dates = getDatesRange();
  const meetingDates = [];
  
  dates.forEach(date => {
    // Compter les personnes par ville
    const cityCounts = {};
    
    friends.forEach(f => {
      f.stays?.forEach(s => {
        if (s.checkin <= date && (!s.checkout || s.checkout >= date)) {
          if (!cityCounts[s.city]) {
            cityCounts[s.city] = [];
          }
          cityCounts[s.city].push(f.name);
        }
      });
    });
    
    // Vérifier s'il y a au moins 2 personnes à la même ville
    for (let city in cityCounts) {
      if (cityCounts[city].length >= 2) {
        meetingDates.push(date);
        break;
      }
    }
  });
  
  return meetingDates;
}

function getOffsetCoordinates(lat, lng, index = 0) {
  // Crée un petit décalage autour du point pour éviter que les marqueurs se chevauchent
  const radius = 0.015; // ~1.5km de décalage max
  const angle = (index * 360 / 3) * Math.PI / 180; // Répartir en 3 direction au max
  const offsetLat = lat + radius * Math.cos(angle);
  const offsetLng = lng + radius * Math.sin(angle);
  return [offsetLat, offsetLng];
}

function load() {
  if (db) {
    // Charger depuis Firebase avec écouteur en temps réel
    db.ref('vietnam-trip').on('value', (snapshot) => {
      if (snapshot.exists()) {
        friends = snapshot.val();
        console.log('✅ Données chargées depuis Firebase');
      } else {
        friends = [];
        console.log('Pas de données dans Firebase');
      }
      render();
    }, (error) => {
      console.error('Erreur Firebase:', error);
      // Fallback sur localStorage
      const saved = localStorage.getItem('vietnam');
      if (saved) {
        try {
          friends = JSON.parse(saved);
        } catch (e) {
          friends = [];
        }
      }
      render();
    });
  } else {
    // Fallback sur localStorage
    const saved = localStorage.getItem('vietnam');
    if (saved) {
      try {
        friends = JSON.parse(saved);
      } catch (e) {
        console.error('Load error:', e);
        friends = [];
      }
    }
    render();
  }
}

function save() {
  try {
    if (db) {
      // Sauvegarder dans Firebase Realtime Database
      db.ref('vietnam-trip').set(friends).then(() => {
        console.log('✅ Données sauvegardées dans Firebase');
      }).catch(err => {
        console.error('Erreur Firebase:', err);
        // Fallback sur localStorage
        localStorage.setItem('vietnam', JSON.stringify(friends));
      });
    } else {
      // Fallback sur localStorage si Firebase n'est pas configuré
      localStorage.setItem('vietnam', JSON.stringify(friends));
    }
  } catch (e) {
    console.error('Save error:', e);
  }
}

function saveFriendHandler(e) {
  e.preventDefault();
  
  const name = document.getElementById('name').value;
  const color = document.getElementById('color').value;
  
  const flights = Array.from(document.querySelectorAll('.flight-form')).map(div => ({
    date: div.querySelector('.flight-date').value,
    time: div.querySelector('.flight-time').value,
    from: div.querySelector('.flight-from').value,
    to: div.querySelector('.flight-to').value,
    airline: div.querySelector('.flight-airline').value,
    status: div.querySelector('.flight-status').value || 'booked',
    comments: []
  }));
  
  const stays = Array.from(document.querySelectorAll('.stay-form')).map(div => {
    const city = div.querySelector('.stay-city').value;
    return {
      checkin: div.querySelector('.stay-checkin').value,
      checkout: div.querySelector('.stay-checkout').value,
      city: city,
      hotel: div.querySelector('.stay-hotel').value,
      status: div.querySelector('.stay-status').value || 'booked',
      lat: cities[city]?.[0] || 0,
      lng: cities[city]?.[1] || 0,
      comments: []
    };
  });
  
  if (editId) {
    const f = friends.find(x => x.id === editId);
    f.name = name;
    f.color = color;
    f.flights = flights;
    f.stays = stays;
  } else {
    friends.push({ id: Date.now(), name, color, flights, stays });
  }
  
  save();
  render();
  closeModal();
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function deleteFriend(id) {
  if (!confirm('Delete this friend?')) return;
  friends = friends.filter(f => f.id !== id);
  save();
  render();
}

function editFriend(id) {
  editId = id;
  const f = friends.find(x => x.id === id);
  document.getElementById('formtitle').textContent = 'Edit ' + f.name;
  document.getElementById('name').value = f.name;
  document.getElementById('color').value = f.color;
  document.getElementById('itemlist').innerHTML = '';
  
  f.flights?.forEach(fl => {
    addFlightForm();
    const lastDiv = document.querySelector('.flight-form:last-child');
    lastDiv.querySelector('.flight-date').value = fl.date;
    lastDiv.querySelector('.flight-time').value = fl.time;
    lastDiv.querySelector('.flight-from').value = fl.from;
    lastDiv.querySelector('.flight-to').value = fl.to;
    lastDiv.querySelector('.flight-airline').value = fl.airline;
    lastDiv.querySelector('.flight-status').value = fl.status || 'booked';
  });
  
  f.stays?.forEach(st => {
    addStayForm();
    const lastDiv = document.querySelector('.stay-form:last-child');
    lastDiv.querySelector('.stay-checkin').value = st.checkin;
    lastDiv.querySelector('.stay-checkout').value = st.checkout;
    lastDiv.querySelector('.stay-city').value = st.city;
    lastDiv.querySelector('.stay-hotel').value = st.hotel;
    lastDiv.querySelector('.stay-status').value = st.status || 'booked';
  });
  
  document.getElementById('modal').classList.add('active');
}

function viewFriend(id) {
  const f = friends.find(x => x.id === id);
  if (!f) return;
  
  document.getElementById('pname').textContent = f.name;
  
  let html = '';
  
  if (f.flights?.length > 0) {
    html += '<div class="section"><div class="stitle">✈ Flights</div>';
    
    // Trier les flights par date et heure
    const sortedFlights = [...f.flights].sort((a, b) => {
      const aDate = new Date(a.date + ' ' + a.time);
      const bDate = new Date(b.date + ' ' + b.time);
      return aDate - bDate;
    });
    
    sortedFlights.forEach((fl) => {
      // Trouver l'index original pour les commentaires
      const originalIdx = f.flights.indexOf(fl);
      const statusEmoji = fl.status === 'booked' ? '✅' : '⏳';
      const statusText = fl.status === 'booked' ? 'Booked' : 'Provisional';
      html += `<div class="event-card">
        <div class="event-card-title">${fl.from} → ${fl.to}</div>
        <div class="event-card-info">📅 ${fl.date} at ${fl.time}${fl.airline ? '<br>🛫 ' + fl.airline : ''}<br><strong>${statusEmoji} ${statusText}</strong></div>
        <div class="event-card-comments" onclick="openCommentModal('${f.id}', 'flight_${originalIdx}')">💬 ${fl.comments?.length || 0} comments</div>
      </div>`;
    });
    html += '</div>';
  }
  
  if (f.stays?.length > 0) {
    html += '<div class="section"><div class="stitle">🏨 Stays</div>';
    
    // Trier les stays par checkin
    const sortedStays = [...f.stays].sort((a, b) => {
      return a.checkin.localeCompare(b.checkin);
    });
    
    sortedStays.forEach((st) => {
      // Trouver l'index original pour les commentaires
      const originalIdx = f.stays.indexOf(st);
      const statusEmoji = st.status === 'booked' ? '✅' : '⏳';
      const statusText = st.status === 'booked' ? 'Booked' : 'Provisional';
      html += `<div class="event-card">
        <div class="event-card-title">${st.city}${st.hotel ? ' — ' + st.hotel : ''}</div>
        <div class="event-card-info">📅 ${st.checkin}${st.checkout ? ' to ' + st.checkout : ''}<br><strong>${statusEmoji} ${statusText}</strong></div>
        <div class="event-card-comments" onclick="openCommentModal('${f.id}', 'stay_${originalIdx}')">💬 ${st.comments?.length || 0} comments</div>
      </div>`;
    });
    html += '</div>';
  }
  
  if (!html) html = '<p style="color: #999;">No events yet</p>';
  
  document.getElementById('pbody').innerHTML = html;
  document.getElementById('panel').classList.add('active');
}

function closePanel() {
  document.getElementById('panel').classList.remove('active');
}

let currentCommentFriendId = null;
let currentCommentEventId = null;

  console.log('Opening comment modal for friend:', friendId, 'event:', eventId);

  console.log('All friends:', friends.map(f => ({ id: f.id, name: f.name })));
  
  const f = friends.find(x => x.id === currentCommentFriendId);

function postCommentNow() {
  console.log('postCommentNow called');
  console.log('currentCommentFriendId:', currentCommentFriendId, 'type:', typeof currentCommentFriendId);
  console.log('currentCommentEventId:', currentCommentEventId);
  
  if (!currentCommentFriendId || !currentCommentEventId) {

function render() {
  renderTimeline();
  renderMap();

function getSameLocationFriends(date) {
  const locations = {};
  
  friends.forEach(f => {
    f.stays?.forEach(s => {
      if (s.checkin <= date && (!s.checkout || s.checkout >= date)) {
        if (!locations[s.city]) {
          locations[s.city] = [];
        }
        locations[s.city].push(f);
      }
    });
  });
  
  // Retourner les amis qui sont au même endroit (3+ personnes minimum)
  let sameLocationFriends = [];
  Object.values(locations).forEach(friendsAtLocation => {
    if (friendsAtLocation.length >= 3) {
      sameLocationFriends = sameLocationFriends.concat(friendsAtLocation);
    }
  });
  
  return sameLocationFriends;
}

function getMeetingCity(date) {
  const locations = {};
  
  friends.forEach(f => {
    f.stays?.forEach(s => {
      if (s.checkin <= date && (!s.checkout || s.checkout >= date)) {
        if (!locations[s.city]) {
          locations[s.city] = [];
        }
        locations[s.city].push(f);
      }
    });
  });
  
  // Trouver la ville avec 3+ personnes
  for (let city in locations) {
    if (locations[city].length >= 3) {
      return city;
    }
  }
  
  return null;
}

function renderTimeline() {
  const dates = getDatesRange();
  const timeline = document.getElementById('timeline');
  timeline.innerHTML = '';
  
  dates.forEach(date => {
    const btn = document.createElement('button');
    btn.className = 'day-btn';
    
    const dateObj = new Date(date);
    const dateText = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    
    // Récupérer les amis au même endroit
    const sameLocation = getSameLocationFriends(date);
    const meetingCity = getMeetingCity(date);
    
    // Déterminer s'il y a un meeting (3+ personnes à la même ville)
    let isMeeting = false;
    if (sameLocation.length >= 3) {
      isMeeting = true;
      btn.classList.add('meeting-date');
    }
    
    // Créer un élément avec le texte et les couleurs des amis
    if (isMeeting && meetingCity) {
      // Il y a 3+ personnes au même endroit - ajouter des indicateurs colorés et le nom de la ville
      const uniqueFriends = [...new Set(sameLocation.map(f => f.id))];
      const colorDots = uniqueFriends.map(fid => {
        const friend = friends.find(f => f.id === fid);
        return `<span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: ${friend.color}; margin-left: 4px;"></span>`;
      }).join('');
      
      btn.innerHTML = `<div style="white-space: normal; line-height: 1.2;">${dateText}<br><span style="font-size: 11px; font-weight: 600; color: #e65100;">🔥 ${meetingCity}</span>${colorDots}</div>`;
    } else {
      btn.textContent = dateText;
    }
    
    if (date === currentDate) {
      btn.classList.add('active');
    }
    
    btn.addEventListener('click', () => {
      currentDate = date;
      render();
    });
    
    timeline.appendChild(btn);
  });
}

function renderMap() {
  mapMarkers.forEach(m => map.removeLayer(m));
  mapMarkers = [];
  
  // Compter les marqueurs par ville/date pour décaler les doublons
  const markersByCity = {};
  
  friends.forEach(f => {
    // Afficher les vols du jour avec des lignes
    f.flights?.forEach(flight => {
      if (flight.date === currentDate) {
        const toCity = flight.to;
        const toCoords = cities[toCity];
        
        // Chercher où est la personne avant le vol
        let startLat = null, startLng = null;
        
        for (let stay of f.stays || []) {
          if (stay.checkin <= flight.date && (!stay.checkout || stay.checkout >= flight.date)) {
            startLat = stay.lat;
            startLng = stay.lng;
            break;
          }
        }
        
        // Si on trouve d'où on part et où on va, tracer la ligne
        if (startLat && startLng && toCoords) {
          const line = L.polyline(
            [[startLat, startLng], [toCoords[0], toCoords[1]]],
            {
              color: f.color,
              weight: 3,
              opacity: 0.7,
              dashArray: '5, 5'
            }
          ).addTo(map);
          mapMarkers.push(line);
          
          // Ajouter un marqueur "avion" au milieu de la ligne
          const midLat = (startLat + toCoords[0]) / 2;
          const midLng = (startLng + toCoords[1]) / 2;
          
          const planeMarker = L.marker([midLat, midLng], {
            icon: L.divIcon({
              html: `<div style="font-size: 24px; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.2));">✈️</div>`,
              iconSize: [24, 24],
              className: 'plane-marker'
            })
          }).addTo(map);
          
          planeMarker.bindPopup(`<b>${f.name}</b><br>✈️ ${flight.from} → ${toCity}<br>📅 ${flight.date} ${flight.time}`);
          mapMarkers.push(planeMarker);
        }
      }
    });
    
    // Afficher les séjours du jour avec des marqueurs
    f.stays?.forEach(s => {
      if (s.checkin <= currentDate && (!s.checkout || s.checkout >= currentDate)) {
        const cityKey = s.city;
        if (!markersByCity[cityKey]) {
          markersByCity[cityKey] = 0;
        }
        
        // Trier les stays par checkin
        const sortedStays = [...(f.stays || [])].sort((a, b) => a.checkin.localeCompare(b.checkin));
        const stayIndex = sortedStays.findIndex(st => st === s);
        const prevStay = stayIndex > 0 ? sortedStays[stayIndex - 1] : null;
        const nextStay = stayIndex < sortedStays.length - 1 ? sortedStays[stayIndex + 1] : null;
        
        const getStatusEmoji = (status) => status === 'booked' ? '✅' : '⏳';
        const getStatusText = (status) => status === 'booked' ? 'Booked' : 'Provisional';
        
        let popupHTML = `<b>${f.name}</b><hr style="margin: 8px 0;">`;
        
        if (prevStay) {
          const prevStatus = getStatusEmoji(prevStay.status || 'booked');
          popupHTML += `<div style="font-size: 11px; margin-bottom: 8px; opacity: 0.6; border-left: 3px solid #ccc; padding-left: 8px;">
            <strong style="display: block; color: #999;">Before</strong>
            📍 ${prevStay.city}${prevStay.hotel ? '<br>🏨 ' + prevStay.hotel : ''}<br>
            <span style="color: #666;">📅 ${prevStay.checkin} to ${prevStay.checkout || '...'}</span><br>
            <span>${prevStatus} ${getStatusText(prevStay.status || 'booked')}</span>
          </div>`;
        }
        
        const currStatus = getStatusEmoji(s.status || 'booked');
        popupHTML += `<div style="font-size: 11px; margin-bottom: 8px; font-weight: bold; color: #3b82f6; border-left: 3px solid #3b82f6; padding-left: 8px;">
          <strong style="display: block;">Now 👈</strong>
          📍 ${s.city}${s.hotel ? '<br>🏨 ' + s.hotel : ''}<br>
          <span style="color: #3b82f6;">📅 ${s.checkin} to ${s.checkout || '...'}</span><br>
          <span>${currStatus} ${getStatusText(s.status || 'booked')}</span>
        </div>`;
        
        if (nextStay) {
          const nextStatus = getStatusEmoji(nextStay.status || 'booked');
          popupHTML += `<div style="font-size: 11px; opacity: 0.6; border-left: 3px solid #ccc; padding-left: 8px;">
            <strong style="display: block; color: #999;">After</strong>
            📍 ${nextStay.city}${nextStay.hotel ? '<br>🏨 ' + nextStay.hotel : ''}<br>
            <span style="color: #666;">📅 ${nextStay.checkin} to ${nextStay.checkout || '...'}</span><br>
            <span>${nextStatus} ${getStatusText(nextStay.status || 'booked')}</span>
          </div>`;
        }
        
        // Décaler légèrement si plusieurs marqueurs au même endroit
        const offsetIndex = markersByCity[cityKey];
        let lat = s.lat;
        let lng = s.lng;
        
        if (offsetIndex > 0) {
          const offset = 0.06;
          if (offsetIndex === 1) {
            lat += offset;
          } else if (offsetIndex === 2) {
            lng += offset;
          } else if (offsetIndex === 3) {
            lat -= offset;
          } else if (offsetIndex === 4) {
            lng -= offset;
          } else if (offsetIndex === 5) {
            lat += offset * 0.7;
            lng += offset * 0.7;
          } else {
            lat -= offset * 0.7;
            lng -= offset * 0.7;
          }
        }
        
        markersByCity[cityKey]++;
        
        // Décaler légèrement le marqueur pour éviter les chevauchements
        const [offsetLat, offsetLng] = getOffsetCoordinates(lat, lng, markersByCity[cityKey] - 1);
        
        const marker = L.circleMarker([offsetLat, offsetLng], {
          radius: 8,
          fillColor: f.color,
          color: f.color,
          weight: 2,
          opacity: 1,
          fillOpacity: 0.8
        }).addTo(map);
        
        marker.bindPopup(popupHTML);
        
        // Ajouter un tooltip au survol
        marker.bindTooltip(`${f.name} - ${s.city}`, { permanent: false, direction: 'top' });
        
        mapMarkers.push(marker);
      }
    });
  });
}

function renderList() {
  const list = document.getElementById('list');
  if (friends.length === 0) {
    list.innerHTML = '<div style="padding: 1.5rem; text-align: center; color: #999; font-size: 13px;">No friends yet</div>';
    return;
  }
  
  list.innerHTML = friends.map(f => {
    const total = (f.flights?.length || 0) + (f.stays?.length || 0);
    const lastStay = f.stays?.[f.stays.length - 1];
    return `<div class="friend" style="cursor: default;">
      <div class="fname">
        <div class="fdot" style="background: ${f.color}"></div>
        ${f.name}
        <button class="fdel" onclick="doDelete(${f.id}); return false;">×</button>
      </div>
      <div class="fstops">${total} events${lastStay ? ' • ' + lastStay.city : ''}</div>
      <div class="fbtns">
        <button class="fbtn" onclick="doEdit(${f.id}); return false;">Edit</button>
        <button class="fbtn" onclick="doView(${f.id}); return false;">View</button>
      </div>
    </div>`;
  }).join('');
}

  console.log('Edit clicked for:', id);
